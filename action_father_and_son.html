<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="ru-ru" dir="ltr" xml:lang="ru-ru" xmlns="http://www.w3.org/1999/xhtml" slick-uniqueid="3">
<head>
<meta charset="utf-8"/>
<meta http-equiv="X-UA-Compatible" content="IE=edge"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Father and son</title>
<link href="css/style.css" rel="stylesheet" type="text/css"/>
<script src="../src/resources/services.cfg"></script>
<script src="../dist/services.cfg"></script>
<script type="text/javascript" src="js/dispatcher.js"></script>
<script type="text/javascript" src="js/configuration.js"></script>
<script type="text/javascript" src="js/jquery-3.3.1.min.js"></script>
<script type="text/javascript" src="js/pinger.js"></script>

<script>

  var nextUrl = "client_phone.html";

  function initPage() {
    var param = getReqParams();
    var TYPE = param['type'];
    var CODE = param['code'];

    var name = "";
    var cost = 0;

    if (TYPE != null && TYPE != '') {
      name = getService(TYPE, CODE).name;
      cost = getService(TYPE, CODE).cost / 2;
    }

    document.getElementById('comment_1').innerHTML = "Акция подразумевает две отдельных <br/> оплаты по " + cost + " рублей";
    document.getElementById('comment_2').innerHTML = "за отца и сына, с возможностью выбрать необходимые доп. услуги";
  }

  function init(info) {
    pinger(info.options);
  }

  function next() {
    document.location.href = nextUrl + location.search;
  }

  function back() {
    document.location.href = "actions.html";
  }

</script>

<body onload="initPage(); DispatcherWebSocket();">
<div class="logo"></div>
<div class="container">
  <div class="center4">
    <div class="tiket">
      <st3><br/></st3>
    </div>
    <div class="tiket">
      <st3>Обращаем внимание!</st3>
    </div>
    <div class="tiket">
      <st5 id="comment_1"></st5>
      <st5><br/></st5>
    </div>
    <div class="tiket">
      <st5 id="comment_2"></st5>
    </div>
  </div>
  <div class="gfooter1">
    <button class="thumb1" onclick='back();'/><div class="thumb1text gtv">НАЗАД</div>
    <button class="thumb1" onclick='next();'/><div class="thumb1text gtv">ДАЛЕЕ</div>
  </div>
</div>
</body>
</html>
