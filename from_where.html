<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="ru-ru" dir="ltr" xml:lang="ru-ru" xmlns="http://www.w3.org/1999/xhtml" slick-uniqueid="3">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From where</title>
<link href="css/style.css" rel="stylesheet" type="text/css">

<script src="../src/resources/services.cfg"></script>
<script src="../dist/services.cfg"></script>
<script src="../src/resources/params.cfg"></script>
<script src="../dist/params.cfg"></script>
<script type="text/javascript" src="js/dispatcher.js"></script>
<script type="text/javascript" src="js/configuration.js"></script>
<script type="text/javascript" src="js/jquery-3.3.1.min.js"></script>
<script type="text/javascript" src="js/pinger.js"></script>

<script>
	
var nextUrl = "voting.html";

function initView() {

    var objs = termParams["fromWhere"];

    if (objs != null) {
        for (var i = 0; i < 9; i++) {
            initFwBtn(i+1, objs.length >= i+1 ? objs[i] : null);
        }
    }
}

function initFwBtn(i, obj) {

    var elt = document.getElementById('fw_' + i);

    if (obj != null) {
        document.getElementById('fw_' + i + '_name').innerHTML = obj.name;

        elt.addEventListener("click", function() {
            next(obj.id);
        });

        if (obj.enabled != null && !obj.enabled) {
            elt.disabled = "true";
        }

        if (obj.id == 0) {
            elt.className += " regular_client";
        }

    } else {
        elt.style.visibility='hidden';
    }
}

function init(info) {
    pinger(info.options);
}

function next(item) {
	document.location.href = nextUrl + location.search + "&from_where=" + item;
}
	
</script>

</head>
<body onload="initView();DispatcherWebSocket();">
<div class="logo"></div>
<div class="container">
   <div class="tiket">
     <st3>ОТКУДА ВЫ О НАС УЗНАЛИ?</st3>
   </div>
   <div class="from_where_panel">
     <div class="line1">
       <button class="thumb1" id="fw_1"/><div class="thumb1text" id="fw_1_name"></div>
       <button class="thumb1" id="fw_2"/><div class="thumb1text" id="fw_2_name"></div>
       <button class="thumb1" id="fw_3"/><div class="thumb1text" id="fw_3_name"></div>
     </div>
     <div class="line1">
       <button class="thumb1" id="fw_4"/><div class="thumb1text" id="fw_4_name"></div>
       <button class="thumb1" id="fw_5"/><div class="thumb1text" id="fw_5_name"></div>
       <button class="thumb1" id="fw_6"/><div class="thumb1text" id="fw_6_name"></div>
     </div>
     <div class="line1">
       <button class="thumb1" id="fw_7"/><div class="thumb1text" id="fw_7_name"></div>
       <button class="thumb1" id="fw_8"/><div class="thumb1text" id="fw_8_name"></div>
       <button class="thumb1" id="fw_9"/><div class="thumb1text" id="fw_9_name"></div>
     </div>
   </div>
</div>
</body>
</html>
