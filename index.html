<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="ru-ru" dir="ltr" xml:lang="ru-ru" xmlns="http://www.w3.org/1999/xhtml" slick-uniqueid="3">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MainSU</title>
<link href="css/style.css" rel="stylesheet" type="text/css">
<link rel="stylesheet" type="text/css" href="css/modal-win.css" />

<script src="../src/resources/services.cfg"></script>
<script src="../dist/services.cfg"></script>
<script src="../src/resources/market.cfg"></script>
<script src="../dist/market.cfg"></script>
<script type="text/javascript" src="js/dispatcher.js"></script>
<script type="text/javascript" src="js/configuration.js"></script>
<script type="text/javascript" src="js/jquery-3.3.1.min.js"></script>
<script type="text/javascript" src="js/modal-win.js"></script>
<script type="text/javascript" src="js/pinger.js"></script>

<script>

	var nextUrl = "client_phone.html";
  
  	function initView() {
 		initBtn('haircut', 'a');
  		initBtn('haircut', 'b');
  		initBtn('haircut', 'c');
  		initBtn('haircut', 'd');
  		initBtn('haircut', 'e');
  		initBtn('haircut', 'f');
        initBtn('haircut', 'g');
        initBtn('haircut', 'o');


        if (typeof market !== 'undefined') {
          $('#market_btn').prop('disabled', false);
        }
  	}

  	function next(params) {
  		document.location.href = nextUrl + "?type=haircut&code=" + params;
  	}
  	
  	function init(info) {
		setCashmachineEnabled(false, true);
        pinger(info.options);
	}

    function refreshSettings() {
        window.location.reload();
    }

    function handleStaffShiftOperation(result) {

        let messageText = '';

        if (result.text == 'shift_opened') {
          messageText = "Смена открыта";
          setTimeout('closeModal()', 1000);
        }
        else if (result.text == 'shift_already_opened')
          messageText = "Смена уже открыта";
        else if (result.text == 'shift_closed') {
          messageText = "Смена закрыта";
          setTimeout('closeModal()', 1000);
        }
        else if (result.text == 'shift_already_closed')
          messageText = "Смена уже закрыта";
        else if (result.text == 'pin_not_found')
          messageText = "Введен не верный код";
        else
          messageText = "Что то пошло не так, попробуйте позже";

        clearStaffOpResultMsg();
        $("#staff_op_result_msg").append(messageText);

        setTimeout('clearStaffOpResultMsg()', 2000);
    }

    function clearStaffOpResultMsg() {
      $("#staff_op_result_msg").empty();
    }

</script>
  
</head>
<body onload="initView(); DispatcherWebSocket();">
<!-- Main Container -->
<div class="logo" ondblclick="openModal('#staff_pin_dialog');"></div>
<div class="container"> 
  <!-- Stats Gallery Section -->
  <div class="line1">
    <button class="thumb1 services" onclick='document.location.href = "extras.html";'><div class="thumb1text">ДОП. УСЛУГИ</div></button>
    <button class="thumb1 services" onclick='document.location.href = "actions.html";'><div class="thumb1text">АКЦИИ</div></button>
  </div>
  <div class="line1">
    <button class="thumb2 cards1" onclick='next("a")' id="haircut_a"><div class="thumb2text"><span id="haircut_a_name"></span><br/><span id="haircut_a_cost">0</span><span class="currency">q</span></div></button>
    <button class="thumb2 cards2" onclick='next("b")' id="haircut_b"><div class="thumb2text"><span id="haircut_b_name"></span><br/><span id="haircut_b_cost">0</span><span class="currency">q</span></div></button>
    <button class="thumb2 cards3" onclick='next("c")' id="haircut_c"><div class="thumb2text"><span id="haircut_c_name"></span><br/><span id="haircut_c_cost">0</span><span class="currency">q</span></div></button>
    <button class="thumb2 cards7" onclick='next("g")' id="haircut_g"><div class="thumb2text"><span id="haircut_g_name"></span><br/><span id="haircut_g_cost">0</span><span class="currency">q</span></div></button>
  </div>
  <div class="line2">
    <button class="thumb2 cards4" onclick='next("d")'><div class="thumb2text"><span id="haircut_d_name"></span><br/><span id="haircut_d_cost">0</span><span class="currency">q</span></div></button>
    <button class="thumb2 cards5" onclick='next("e")' id="haircut_e"><div class="thumb2text"><span id="haircut_e_name"></span><br/><span id="haircut_e_cost">0</span><span class="currency">q</span></div></button>
    <button class="thumb2 cards6" onclick='next("f")' id="haircut_f"><div class="thumb2text"><span id="haircut_f_name"></span><br/><span id="haircut_f_cost">0</span><span class="currency">q</span></div></button>
    <button class="thumb2 cards8" onclick='next("o")' id="haircut_o"><div class="thumb2text red_background"><span id="haircut_o_name"></span><br/><span id="haircut_o_cost">0</span><span class="currency">q</span></div></button>
  </div>
  <div class="line2">
    <button class="thumb1 market" id="market_btn" onclick='document.location.href = "client_phone.html?type=market";' disabled="true" ><div class="thumb1text"><span>НАШ </span><span class="red">Супер</span><span>Маркет</span></div></button>
  </div>
</div>
<!-- Main Container Ends -->

<!-- modal window -->
<div id="boxes">

  <!-- pin pad dialog -->
  <div id="staff_pin_dialog" class="window">

    <div class="font_32 dialog_text_box">Введите pin:</div>
    <table width="100%">
      <tr>
        <td align="center">
          <input id="passw" class="login_input_field" type="password"><br/>
          <table>
            <tr>
              <td><button onclick="addNum('1', 'passw');" class="num_pad_button">1</button></td>
              <td><button onclick="addNum('2', 'passw');" class="num_pad_button">2</button></td>
              <td><button onclick="addNum('3', 'passw');" class="num_pad_button">3</button></td>
            </tr>
            <tr>
              <td><button onclick="addNum('4', 'passw');" class="num_pad_button">4</button></td>
              <td><button onclick="addNum('5', 'passw');" class="num_pad_button">5</button></td>
              <td><button onclick="addNum('6', 'passw');" class="num_pad_button">6</button></td>
            </tr>
            <tr>
              <td><button onclick="addNum('7', 'passw');" class="num_pad_button">7</button></td>
              <td><button onclick="addNum('8', 'passw');" class="num_pad_button">8</button></td>
              <td><button onclick="addNum('9', 'passw');" class="num_pad_button">9</button></td>
            </tr>
            <tr>
              <td><button onclick="addNum('0', 'passw');" class="num_pad_button">0</button></td>
              <td colspan="2"><button onclick="delNum('passw');" class="clear_pad_button">стереть</button></td>
            </tr>
          </table>
        </td>
      </tr>
      <tr>
        <td colspan="3">
          <div id="staff_op_result_msg"></div>
        </td>
      </tr>
      <tr>
        <td>
          <button class="staff_modal_button" onclick="staffShiftOperation($('#passw').val(), 'shift_open');">открыть смену</button>
          <button class="staff_modal_button" onclick="staffShiftOperation($('#passw').val(), 'shift_close');">закрыть смену</button>
          <button class="staff_modal_button" onclick="closeModal();">отмена</button>
        </td>
      </tr>
    </table>
  </div>

  <div id="mask"></div>
</div>

</body>
</html>
