<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="ru-ru" dir="ltr" xml:lang="ru-ru" xmlns="http://www.w3.org/1999/xhtml" slick-uniqueid="3">
<head>
<meta charset="utf-8"/>
<meta http-equiv="X-UA-Compatible" content="IE=edge"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Father and son</title>
<link href="css/style.css" rel="stylesheet" type="text/css"/>
<script src="../src/resources/services.cfg"></script>
<script src="../dist/services.cfg"></script>
<script type="text/javascript" src="js/dispatcher.js"></script>
<script type="text/javascript" src="js/configuration.js"></script>
<script type="text/javascript" src="js/jquery-3.3.1.min.js"></script>
<script type="text/javascript" src="js/pinger.js"></script>

<script>

  var nextUrl = "client_phone.html";

  function initPage() {
    var param = getReqParams();
    var TYPE = param['type'];
    var CODE = param['code'];

    var name = "";
    var cost = 0;

    if (TYPE != null && TYPE != '') {
      name = getService(TYPE, CODE).name;
      cost = getService(TYPE, CODE).cost / 2;
    }

    document.getElementById('father_cost').textContent = cost + ' ₽';
    document.getElementById('son_cost').textContent = cost + ' ₽';
    document.getElementById('comment_1').innerHTML = "Акция подразумевает две отдельных <br/> оплаты по " + cost + " рублей";
    document.getElementById('comment_2').innerHTML = "за отца и сына, с возможностью выбрать необходимые доп. услуги";
  }

  function init(info) {
    pinger(info.options);
  }

  function next() {
    document.location.href = nextUrl + location.search;
  }

  function back() {
    document.location.href = "actions.html";
  }

</script>

<link href="css/finish-v83.css" rel="stylesheet"><script src="js/finish-v83.js"></script>
<body onload="initPage(); DispatcherWebSocket();"><main class="finish-stage"><header><div class="eyebrow">Акции</div><h1>Отец + сын</h1></header><section class="panel father-main"><img class="father-art" src="images/promo-father-son.svg" alt="Отец и сын"><div><h2>Вместе — выгоднее</h2><p style="margin-top:18px">Две стрижки.<br>Две отдельные оплаты.</p><div class="split-pay"><article><h2>За отца</h2><strong id="father_cost"></strong></article><article><h2>За сына</h2><strong id="son_cost"></strong></article></div><p class="note">Дополнительные услуги можно выбрать отдельно для каждого.</p><div id="comment_1" hidden></div><div id="comment_2" hidden></div></div></section><footer class="footer"><button onclick="back()">‹ Назад</button><button class="primary" onclick="next()">Понятно, далее ›</button></footer></main></body>
</html>
