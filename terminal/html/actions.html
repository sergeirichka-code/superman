<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="ru-ru" dir="ltr" xml:lang="ru-ru" xmlns="http://www.w3.org/1999/xhtml" slick-uniqueid="3">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Actions</title>
<link href="css/style.css" rel="stylesheet" type="text/css">

<script src="../src/resources/services.cfg"></script>
<script src="../dist/services.cfg"></script>
<script type="text/javascript" src="js/dispatcher.js"></script>
<script type="text/javascript" src="js/configuration.js"></script>
<script type="text/javascript" src="js/jquery-3.3.1.min.js"></script>
<script type="text/javascript" src="js/pinger.js"></script>
  <script>

	var nextUrl = "client_phone.html";
  
  	function initView() {
  		initBtn('action', 'a');
  		initBtn('action', 'b');
  		initBtn('action', 'c');
  		initBtn('action', 'd');

        if (getService('action', 'a').days == null && getWeekDay() != 1) {
          document.getElementById("action_a").disabled = "true";
        }
        if (getService('action', 'b').days == null && getWeekDay() != 3) {
          document.getElementById("action_b").disabled = "true";
        }
  	}
  	

  	function next(params) {
  	    if (params == "b")
  	        nextUrl = "action_father_and_son.html";

  		document.location.href = nextUrl + "?type=action&code=" + params;
  	}
  	
  	function init(info) {
		setCashmachineEnabled(false, true);
        pinger(info.options);
	}

    function getWeekDay() {
        var time = new Date();
        return time.getDay();
    }

    function refreshSettings() {
      window.location.reload();
    }
  </script>
  
</head>
<body onload="initView(); DispatcherWebSocket();">
<!-- Main Container -->
<div class="logo"></div>
<div class="container">
  <div class="tiket">
    <st3>ДОСТУПНЫЕ АКЦИИ</st3>
  </div>

  <div class="line1">
    <button class="thumb_actions" onclick='next("a")' id="action_a"><div class="thumb_actions_label" id="action_a_name"></div><div class="thumb_actions_text"><span id="action_a_cost">0</span><span class="currency">q</span></div></button>
    <button class="thumb_actions" onclick='next("b")' id="action_b"><div class="thumb_actions_label" id="action_b_name"></div><div class="thumb_actions_text"><span id="action_b_cost">0</span><span class="currency">q</span></div></button>
  </div>
  <div class="line2">
    <button class="thumb_actions" onclick='next("c")' id="action_c"><div class="thumb_actions_label" id="action_c_name"></div><div class="thumb_actions_text"><span id="action_c_cost">0</span><span class="currency">q</span></div></button>
    <button class="thumb_actions" onclick='next("d")' id="action_d"><div class="thumb_actions_label" id="action_d_name"></div><div class="thumb_actions_text"><span id="action_d_cost">0</span><span class="currency">q</span></div></button>
  </div>

  <div class="line2">
    <button class="thumb1 market" onclick='document.location.href = "index.html";'><div class="thumb1text">НАЗАД К ВЫБОРУ СТРИЖЕК</div></button>
  </div>
</div>
<!-- Main Container Ends -->
</body>
</html>
