<script>
(function () {
  var BASE_W = 1280;
  var BASE_H = 1024;

  function calculateTerminalScale() {
    var vw = window.innerWidth || document.documentElement.clientWidth || BASE_W;
    var vh = window.innerHeight || document.documentElement.clientHeight || BASE_H;

    // Always fit the complete 1280×1024 terminal inside the visible browser area.
    // This prevents vertical scrolling and preserves the exact 5:4 proportions.
    var scale = Math.min(vw / BASE_W, vh / BASE_H);

    // Native terminal remains pixel-perfect 1:1.
    if (Math.abs(vw - BASE_W) <= 2 && Math.abs(vh - BASE_H) <= 2) {
      scale = 1;
    }

    if (!isFinite(scale) || scale <= 0) scale = 1;
    return scale;
  }

  function applyTerminalScale() {
    var scale = calculateTerminalScale();
    var root = document.documentElement;
    root.style.setProperty('--terminal-scale', scale.toFixed(4));
    root.style.setProperty('--terminal-shell-width', (BASE_W * scale).toFixed(2) + 'px');
    root.style.setProperty('--terminal-shell-height', (BASE_H * scale).toFixed(2) + 'px');
    root.classList.add('terminal-scale-ready');
  }

  window.fitTerminalStage = applyTerminalScale;
  applyTerminalScale();
  window.addEventListener('resize', applyTerminalScale);
  window.addEventListener('orientationchange', applyTerminalScale);
})();
</script>
