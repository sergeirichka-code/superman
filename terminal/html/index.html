<script>
(function () {
  var BASE_W = 1280;
  var BASE_H = 1024;

  function calculateTerminalScale() {
    var vw = window.innerWidth || document.documentElement.clientWidth || BASE_W;
    var vh = window.innerHeight || document.documentElement.clientHeight || BASE_H;

    // Always fit the complete 1280×1024 terminal inside the visible browser area.
    // This prevents vertical scrolling and preserves the exact 5:4 proportions.
    var scale = Math.min(vw / BASE_W, vh / BASE_H);

    // Native terminal remains pixel-perfect 1:1.
    if (Math.abs(vw - BASE_W) <= 2 && Math.abs(vh - BASE_H) <= 2) {
      scale = 1;
    }

    if (!isFinite(scale) || scale <= 0) scale = 1;
    return scale;
  }

  function applyTerminalScale() {
    var scale = calculateTerminalScale();
    var root = document.documentElement;
    root.style.setProperty('--terminal-scale', scale.toFixed(4));
    root.style.setProperty('--terminal-shell-width', (BASE_W * scale).toFixed(2) + 'px');
    root.style.setProperty('--terminal-shell-height', (BASE_H * scale).toFixed(2) + 'px');
    root.classList.add('terminal-scale-ready');
  }

  window.fitTerminalStage = applyTerminalScale;
  applyTerminalScale();
  window.addEventListener('resize', applyTerminalScale);
  window.addEventListener('orientationchange', applyTerminalScale);
})();
</script>

<script>
  var nextUrl = "client_phone.html";

  function initView() {
    initBtn('haircut', 'a');
    initBtn('haircut', 'e');
  }

  function next(params) {
    document.location.href = nextUrl + "?type=haircut&code=" + params;
  }

  function init(info) {
    setCashmachineEnabled(false, true);
    pinger(info.options);
  }

  function refreshSettings() {
    window.location.reload();
  }

  function openService(code) {
    var service = getService('haircut', code);
    if (!service || !isServiceEnabled(service)) return;
    next(code);
  }

  function handleStaffShiftOperation(result) {
    let messageText = '';

    if (result.text == 'shift_opened') {
      messageText = "Смена открыта";
      setTimeout('closeModal()', 1000);
    }
    else if (result.text == 'shift_already_opened')
      messageText = "Смена уже открыта";
    else if (result.text == 'shift_closed') {
      messageText = "Смена закрыта";
      setTimeout('closeModal()', 1000);
    }
    else if (result.text == 'shift_already_closed')
      messageText = "Смена уже закрыта";
    else if (result.text == 'pin_not_found')
      messageText = "Введен не верный код";

    $("#staff_op_result_msg").text(messageText);
  }

  function beforeStaffShiftOperation() {
    $("#staff_op_result_msg").empty();
  }
</script>
