<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="ru-ru" dir="ltr" xml:lang="ru-ru" xmlns="http://www.w3.org/1999/xhtml" slick-uniqueid="3">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market select post</title>

<link href="css/style.css" rel="stylesheet" type="text/css">

<script type="text/javascript" src="js/jquery-3.3.1.min.js"></script>
<script src="js/dispatcher.js"></script>
<script type="text/javascript" src="js/pinger.js"></script>

<script>

var nextUrl = "market.html";
var postsCount = 8;

function init(info) {

    if (info.options != null && info.options['posts_count'] != null) {
        postsCount = parseInt(info.options['posts_count']);
    }

    staffPostsListRequest();

    pinger(info.options);
}

function select_post(postNum) {
    document.location.href = nextUrl + location.search + "&post=" + postNum;
}

function handleStaffPostsListRequest(result) {

    if (result.result == "ok") {

        if (result.postsList == null || result.postsList.length == 0) {
            $("#btn_next").removeClass("hidden");
        }

        for (var i = 0; i < result.postsList.length; i++) {
            $("#post_" + result.postsList[i]).prop('disabled', false);
        }
    } else {
        for (var i = 1; i <= postsCount; i++) {
            $("#post_" + i).prop('disabled', false);
        }
    }
}
	
</script>

</head>
<link href="css/finish-v83.css" rel="stylesheet"><script src="js/finish-v83.js"></script>
<body onload="DispatcherWebSocket();"><main class="finish-stage"><header><div class="eyebrow">Супермаркет</div><h1>Выберите номер мастера</h1><p style="margin-top:16px">У которого вы обслуживались</p></header><section class="post-grid"><button id="post_1" onclick="select_post(1)" disabled><span>Мастер</span>1</button><button id="post_2" onclick="select_post(2)" disabled><span>Мастер</span>2</button><button id="post_3" onclick="select_post(3)" disabled><span>Мастер</span>3</button><button id="post_4" onclick="select_post(4)" disabled><span>Мастер</span>4</button><button id="post_5" onclick="select_post(5)" disabled><span>Мастер</span>5</button><button id="post_6" onclick="select_post(6)" disabled><span>Мастер</span>6</button><button id="post_7" onclick="select_post(7)" disabled><span>Мастер</span>7</button><button id="post_8" onclick="select_post(8)" disabled><span>Мастер</span>8</button></section><footer class="footer"><button id="btn_next" class="hidden" onclick="document.location.href='index.html'">‹ Назад</button></footer></main></body>
</html>
