<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MainSU</title>
<link href="css/style.css" rel="stylesheet" type="text/css">
<link href="css/home-v3.css" rel="stylesheet" type="text/css">
<link rel="stylesheet" type="text/css" href="css/modal-win.css">












</head>

<body class="home-v3">
  <main class="terminal-app">
    <header class="terminal-header">
      <button class="brand-button" ondblclick="openModal('#staff_pin_dialog');" aria-label="СУПЕРМЕН">
        <img src="images/logo-v2.png" alt="СУПЕРМЕН — мужские стрижки">
      </button>

      <nav class="header-actions" aria-label="Разделы">
        <button class="header-action" onclick='document.location.href = "extras.html";'>
          <span class="header-action-icon" aria-hidden="true">
            <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="10"/><path d="M16 10v12M10 16h12"/></svg>
          </span>
          <span class="header-action-label">Доп. услуги</span>
        </button>
        <button class="header-action" onclick='document.location.href = "actions.html";'>
          <span class="header-action-icon" aria-hidden="true">
            <svg viewBox="0 0 32 32"><path d="M5 8v8l11 11 11-11L16 5H8a3 3 0 0 0-3 3Z"/><circle cx="11" cy="11" r="2.2"/></svg>
          </span>
          <span class="header-action-label">Акции</span>
        </button>
        <button class="header-action" onclick='document.location.href = "market.html";'>
          <span class="header-action-icon market-icon" aria-hidden="true">
            <svg viewBox="0 0 32 32"><path d="M8 11h16l-1.8 12.5H9.8L8 11Z"/><path d="M12 11V8.7A4.3 4.3 0 0 1 16.3 4.4h-.6A4.3 4.3 0 0 1 20 8.7V11"/></svg>
          </span>
          <span class="header-action-label">Наш Супермаркет</span>
        </button>
      </nav>
    </header>

    <section class="services-surface">
      <div class="surface-decor" aria-hidden="true">
        <img class="surface-decor-dots" src="images/decor-dot-circle.png" alt="">
        <img class="surface-decor-red" src="images/decor-red-shape.svg" alt="">
        <img class="surface-decor-comb" src="images/decor-comb.png" alt="">
        <img class="surface-decor-stripes" src="images/decor-stripes-red.png" alt="">
      </div>
      <div class="services-heading">
        <div>
          <h1>УСЛУГИ</h1>
          <p>Выбери вариант стрижки</p>
        </div>
        <div class="heading-art" aria-hidden="true">
          <img class="heading-comb" src="images/decor-comb.png" alt="">
          <img class="heading-stripes-img" src="images/decor-stripes-blue.png" alt="">
        </div>
      </div>

      <div class="service-grid">
        <button class="service-card" id="haircut_a" onclick='openService("a")'>
          <div class="service-image-wrap">
            <span class="service-badge blue">МАШИНКОЙ</span>
            <span class="decor-dots"></span>
            <img src="images/service-clipper.png" alt="Под насадку">
          </div>
          <div class="service-card-body">
            <div class="service-copy">
              <h2 id="haircut_a_name">ПОД НАСАДКУ</h2>
              <p>Без перехода, только краевая</p>
            </div>
            <div class="service-card-hint">МАКСИМАЛЬНО КОРОТКО И АККУРАТНО</div>
            <div class="service-meta">
              <span class="service-select-label">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m9 12 2 2 4-4"/></svg>
                Выбрать
              </span>
              <strong><span id="haircut_a_cost">500</span> <span class="rub">₽</span></strong>
            </div>
            <span class="card-arrow">›</span>
          </div>
        </button>

        <button class="service-card" id="haircut_e" onclick='openService("e")'>
          <div class="service-image-wrap">
            <span class="service-badge red">С ПЕРЕХОДОМ</span>
            <img src="images/service-haircut.png" alt="Стрижка">
          </div>
          <div class="service-card-body">
            <span class="corner-stripes"></span>
            <div class="service-copy">
              <h2 id="haircut_e_name">СТРИЖКА</h2>
              <p>Любая форма, с переходом</p>
            </div>
            <div class="service-card-hint">ФОРМУ ОБСУДИ С МАСТЕРОМ</div>
            <div class="service-meta">
              <span class="service-select-label">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m9 12 2 2 4-4"/></svg>
                Выбрать
              </span>
              <strong><span id="haircut_e_cost">1000</span> <span class="rub">₽</span></strong>
            </div>
            <span class="card-arrow">›</span>
          </div>
        </button>
      </div>
    </section>
  </main>

  <section id="staff_pin_dialog" class="window" style="display:none;">
    <div id="staff_pin" class="staff_open_shift">
      <div id="btn_close"><button onclick="closeModal()">X</button></div>
      <div class="text_t">Введите пин код сотрудника</div>
      <div id="staff_op_result_msg"></div>
      <div class="input-group">
        <input id="staff_pin_input" readonly type="text" maxlength="4" />
      </div>
      <div class="keyboard">
        <div><button onclick="staffPinNumberClick('1');">1</button><button onclick="staffPinNumberClick('2');">2</button><button onclick="staffPinNumberClick('3');">3</button></div>
        <div><button onclick="staffPinNumberClick('4');">4</button><button onclick="staffPinNumberClick('5');">5</button><button onclick="staffPinNumberClick('6');">6</button></div>
        <div><button onclick="staffPinNumberClick('7');">7</button><button onclick="staffPinNumberClick('8');">8</button><button onclick="staffPinNumberClick('9');">9</button></div>
        <div><button onclick="staffPinNumberClick('0');">0</button><button onclick="staffPinBackspaceClick();">⌫</button></div>
      </div>
      <div class="actions"><button onclick="staffPinOkClick();">OK</button></div>
    </div>
  </section>
</body>
</html>
