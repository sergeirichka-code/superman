<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="ru-ru" dir="ltr" xml:lang="ru-ru" xmlns="http://www.w3.org/1999/xhtml" slick-uniqueid="3">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voting</title>

<link href="css/style.css" rel="stylesheet" type="text/css">
<link href="css/rateit.css" rel="stylesheet" type="text/css" />

<script type="text/javascript" src="js/jquery-3.3.1.min.js"></script>
<script src="js/dispatcher.js"></script>
<script type="text/javascript" src="js/pinger.js"></script>

<script>

var nextUrl = "payment.html";
var voting = 0;
var post = 0;
var postsCount = 8;

function init(info) {

    if (info.options != null && info.options['posts_count'] != null) {
        postsCount = parseInt(info.options['posts_count']);
    }

    staffPostsListRequest();

    pinger(info.options);
}

function select_post(postNum) {
    post = postNum;

    $('button.thumb1').removeClass('thumb1_sel');
    $('#post_' + postNum).addClass('thumb1_sel');

    if (voting > 0 && post > 0) {
        $("#btn_next").prop('disabled', false);
    }
}

function select_vote(voteNum) {
    voting = voteNum;

    for (var i = 1; i <= 5; i++) {
        if (i <= voteNum) {
            $('#voting_' + i).addClass('voting_star_active');
        } else {
            $('#voting_' + i).removeClass('voting_star_active');
        }
    }

    if (voting > 0 && post > 0) {
        $("#btn_next").prop('disabled', false);
    }
}

function next() {
    document.location.href = nextUrl + location.search + "&voting=" + voting + "&post=" + post;
}

function handleStaffPostsListRequest(result) {

    if (result.postsList == null || result.postsList.length == 0) {
        nextUrl = "index.html";
        $("#btn_next").prop('disabled', false);
        $("#btn_next_label").empty();
        $("#btn_next_label").append("назад");
    }

    if (result.result == "ok") {
        for (var i = 0; i < result.postsList.length; i++) {
            $("#post_" + result.postsList[i]).prop('disabled', false);
        }
    } else {
        for (var i = 1; i <= postsCount; i++) {
            $("#post_" + i).prop('disabled', false);
        }
    }
}

</script>

</head>
<body onload="DispatcherWebSocket();">
<div class="logo"></div>
<div class="container">
   <div class="tiket">
     <st3 class="red">ВЫБЕРИТЕ НОМЕР МАСТЕРА, У КОТОРОГО</st3>
     <st3 class="red">ВЫ ОБСЛУЖИВАЛИСЬ</st3>
   </div>
   <div class="line1">
        <button class="thumb1 pl1" id="post_1" onclick='select_post(1);' ><div class="thumb1text">1</div></button>
        <button class="thumb1 pl1" id="post_2" onclick='select_post(2);' ><div class="thumb1text">2</div></button>
        <button class="thumb1 pl1" id="post_3" onclick='select_post(3);' ><div class="thumb1text">3</div></button>
        <button class="thumb1 pl1" id="post_4" onclick='select_post(4);' ><div class="thumb1text">4</div></button>
   </div>
   <div class="line1">
        <button class="thumb1 pl1" id="post_5" onclick='select_post(5);' ><div class="thumb1text">5</div></button>
        <button class="thumb1 pl1" id="post_6" onclick='select_post(6);' disabled=""><div class="thumb1text">6</div></button>
        <button class="thumb1 pl1" id="post_7" onclick='select_post(7);' disabled=""><div class="thumb1text">7</div></button>
        <button class="thumb1 pl1" id="post_8" onclick='select_post(8);' disabled=""><div class="thumb1text">8</div></button>
    </div>
    <div class="tiket">
        <br/>
    </div>
    <div class="line1">
        <st3 class="red">ОЦЕНИТЕ ВАШ ВИЗИТ</st3>
    </div>
   <div class="line1">
	   <div class="vote voting_star" id="voting_1" onclick="select_vote(1);"><div class="voting_tip">1</div></div>
	   <div class="vote voting_star" id="voting_2" onclick="select_vote(2);"><div class="voting_tip">2</div></div>
	   <div class="vote voting_star" id="voting_3" onclick="select_vote(3);"><div class="voting_tip">3</div></div>
	   <div class="vote voting_star" id="voting_4" onclick="select_vote(4);"><div class="voting_tip">4</div></div>
	   <div class="vote voting_star" id="voting_5" onclick="select_vote(5);"><div class="voting_tip">5</div></div>

       <button class="thumb1 vote_next_btn" id="btn_next" onclick="next();" disabled="true"><div id="btn_next_label" class="thumb1text gtv">далее</div></button>
   </div>

</div>
</body>
</html>
