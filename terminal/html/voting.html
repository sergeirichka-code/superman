<html lang="ru-ru" dir="ltr" xml:lang="ru-ru" xmlns="http://www.w3.org/1999/xhtml" slick-uniqueid="3">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Оценка визита — СУПЕРМЕН</title>

<link href="css/style.css" rel="stylesheet" type="text/css">
<link href="css/rateit.css" rel="stylesheet" type="text/css" />

<script type="text/javascript" src="js/jquery-3.3.1.min.js"></script>
<script src="js/dispatcher.js"></script>
<script type="text/javascript" src="js/pinger.js"></script>

<script>

var nextUrl = "payment.html";
var voting = 0;
var post = 0;
var postsCount = 8;

function init(info) {

    if (info.options != null && info.options['posts_count'] != null) {
        postsCount = parseInt(info.options['posts_count']);
    }

    staffPostsListRequest();

    pinger(info.options);
}

function select_post(postNum) {
    post = postNum;

    $('button.thumb1').removeClass('thumb1_sel');
    $('#post_' + postNum).addClass('thumb1_sel');

    if (voting > 0 && post > 0) {
        $("#btn_next").prop('disabled', false);
    }
}

function select_vote(voteNum) {
    voting = voteNum;

    for (var i = 1; i <= 5; i++) {
        if (i <= voteNum) {
            $('#voting_' + i).addClass('voting_star_active');
        } else {
            $('#voting_' + i).removeClass('voting_star_active');
        }
    }

    if (voting > 0 && post > 0) {
        $("#btn_next").prop('disabled', false);
    }
}

function next() {
    document.location.href = nextUrl + location.search + "&voting=" + voting + "&post=" + post;
}

function handleStaffPostsListRequest(result) {

    if (result.postsList == null || result.postsList.length == 0) {
        nextUrl = "index.html";
        $("#btn_next").prop('disabled', false);
        $("#btn_next_label").empty();
        $("#btn_next_label").append("назад");
    }

    if (result.result == "ok") {
        for (var i = 0; i < result.postsList.length; i++) {
            $("#post_" + result.postsList[i]).prop('disabled', false);
        }
    } else {
        for (var i = 1; i <= postsCount; i++) {
            $("#post_" + i).prop('disabled', false);
        }
    }
}

</script>

<link href="css/voting-v66.css" rel="stylesheet" type="text/css">
<script>
(function () {
  var BASE_W = 1280;
  var BASE_H = 1024;

  function calculateTerminalScale() {
    var vw = window.innerWidth || document.documentElement.clientWidth || BASE_W;
    var vh = window.innerHeight || document.documentElement.clientHeight || BASE_H;

    // Always fit the complete 1280×1024 terminal inside the visible browser area.
    // This prevents vertical scrolling and preserves the exact 5:4 proportions.
    var scale = Math.min(vw / BASE_W, vh / BASE_H);

    // Native terminal remains pixel-perfect 1:1.
    if (Math.abs(vw - BASE_W) <= 2 && Math.abs(vh - BASE_H) <= 2) {
      scale = 1;
    }

    if (!isFinite(scale) || scale <= 0) scale = 1;
    return scale;
  }

  function applyTerminalScale() {
    var scale = calculateTerminalScale();
    var root = document.documentElement;
    root.style.setProperty('--terminal-scale', scale.toFixed(4));
    root.style.setProperty('--terminal-shell-width', (BASE_W * scale).toFixed(2) + 'px');
    root.style.setProperty('--terminal-shell-height', (BASE_H * scale).toFixed(2) + 'px');
    root.classList.add('terminal-scale-ready');
  }

  window.fitTerminalStage = applyTerminalScale;
  applyTerminalScale();
  window.addEventListener('resize', applyTerminalScale);
  window.addEventListener('orientationchange', applyTerminalScale);
})();
</script>
</head>

ia-hidden="true">✓</span></button><button class="thumb1 master-card" id="post_3" onclick="select_post(3);" aria-label="Мастер номер 3"><span class="master-number">3</span><span class="master-check" aria-hidden="true">✓</span></button><button class="thumb1 master-card" id="post_4" onclick="select_post(4);" aria-label="Мастер номер 4"><span class="master-number">4</span><span class="master-check" aria-hidden="true">✓</span></button><button class="thumb1 master-card" id="post_5" onclick="select_post(5);" aria-label="Мастер номер 5"><span class="master-number">5</span><span class="master-check" aria-hidden="true">✓</span></button><button class="thumb1 master-card" id="post_6" onclick="select_post(6);" disabled aria-label="Мастер номер 6"><span class="master-number">6</span><span class="master-check" aria-hidden="true">✓</span></button><button class="thumb1 master-card" id="post_7" onclick="select_post(7);" disabled aria-label="Мастер номер 7"><span class="master-number">7</span><span class="master-check" aria-hidden="true">✓</span></button><button class="thumb1 master-card" id="post_8" onclick="select_post(8);" disabled aria-label="Мастер номер 8"><span class="master-number">8</span><span class="master-check" aria-hidden="true">✓</span></button></div></section><footer class="rating-footer"><p>Выберите оценку и номер мастера</p><button id="btn_next" onclick="next();" disabled><span id="btn_next_label">ДАЛЕЕ</span><span aria-hidden="true">→</span></button></footer></main></div></div></body></html>
